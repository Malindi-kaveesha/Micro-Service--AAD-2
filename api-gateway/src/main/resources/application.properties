spring.application.name=api-gateway
server.port=8080
spring.config.import=optional:configserver:http://localhost:8888
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port=${server.port}
management.endpoints.web.exposure.include=health,info,mappings

spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=lb://user-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.mvc.routes[1].id=vehicle-service
spring.cloud.gateway.mvc.routes[1].uri=lb://vehicle-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/vehicles/**

spring.cloud.gateway.mvc.routes[2].id=parking-service
spring.cloud.gateway.mvc.routes[2].uri=lb://parking-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/parking/**

spring.cloud.gateway.mvc.routes[3].id=payment-service
spring.cloud.gateway.mvc.routes[3].uri=lb://payment-service
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/payments/**
